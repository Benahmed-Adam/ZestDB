<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZestDB</title>
</head>
<body>
    <h1>Boooo</h1>
    <p>The username: <input id="username" type="text" name="username" placeholder="The username" required></p>
    <p>The password: <input id="password" type="password" name="password" placeholder="The password" required></p>
    <p>The command: <input id="cmd" type="text" name="cmd" placeholder="The command" required><button id="send">send</button></p>
    <code id="result"></code>
    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);                    
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        const button = document.getElementById("send");
        const result = document.getElementById("result");
        let ws;

        async function connect() {
            const user = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const token = await sha256(user + password);
            
            ws = new WebSocket("ws://localhost:1237/ws");
            
            ws.onopen = () => {
                ws.send(user + "." + token);
            };
            
            ws.onmessage = (event) => {
                result.innerHTML = event.data;
            };
        }

        button.addEventListener("click", async () => {
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                await connect();
            }
            const cmd = document.getElementById("cmd").value;
            ws.send(cmd);
        });
    </script>
</body>
</html>
