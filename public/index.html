<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZestDB</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font:14px/1.5 system-ui,sans-serif;background:#111;color:#eee;min-height:100vh;padding:20px}
        .c{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 300px;gap:20px}
        h1{margin-bottom:20px;font-weight:300;letter-spacing:2px}
        .s{background:#222;padding:20px;border-radius:4px;margin-bottom:20px}
        .s h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:15px}
        label{display:block;margin-bottom:5px;font-size:12px;color:#888}
        input{width:100%;padding:10px;border:1px solid #333;border-radius:2px;background:#111;color:#eee;font:inherit}
        input:focus{border-color:#666;outline:0}
        .r{display:flex;gap:10px}
        button{padding:10px 20px;border:0;border-radius:2px;cursor:pointer;background:#444;color:#eee;font:inherit;transition:opacity .2s}
        button:hover{opacity:.8}
        #result{background:#111;padding:15px;border-radius:2px;min-height:200px;max-height:400px;overflow:auto;white-space:pre-wrap;font:13px monospace}
        #result .k{color:#888}
        #result .s{color:#ccc}
        #result .n{color:#666}
        #historyList{overflow-y:auto;list-style:none;max-height:60vh}
        #historyList li{padding:8px;margin-bottom:4px;background:#111;border-radius:2px;cursor:pointer;font:12px monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #historyList li:hover{background:#333}
        .st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
        .st.on{background:#4f4}
        .st.off{background:#f44}
        .st.busy{background:#ff4}
        .cs{display:flex;align-items:center;margin-bottom:15px;font-size:12px;color:#666}
        .btn-sm{padding:5px 10px;font-size:11px}
        @media(max-width:800px){.c{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <h1>ZESTDB</h1>
    <div class="c">
        <div>
            <div class="s">
                <h2>Connection</h2>
                <div><label>WebSocket URL</label><input id="url" value="ws://localhost:1237/ws" placeholder="ws://host:port/ws"></div>
                <div style="margin-top:10px"><label>User</label><input id="u" placeholder="username"></div>
                <div style="margin-top:10px"><label>Pass</label><input id="p" type="password" placeholder="password"></div>
                <div class="cs"><span id="sd" class="st off"></span><span id="st">Disconnected</span></div>
                <div><button id="connect">Connect</button></div>
            </div>
            <div class="s">
                <h2>Command</h2>
                <div class="r"><input id="cmd" placeholder="command"><button id="send">Send</button></div>
            </div>
            <div class="s">
                <h2>Result <button id="cpy" class="btn-sm" style="float:right">Copy</button></h2>
                <div id="result">-</div>
            </div>
        </div>
        <div class="s">
            <h2>History <button id="clr" class="btn-sm">Clear</button></h2>
            <ul id="historyList"></ul>
        </div>
    </div>
    <script>
        var h=function(v){
            var b=new TextEncoder().encode(v);
            return crypto.subtle.digest('SHA-256',b).then(function(x){
                return Array.from(new Uint8Array(x)).map(function(y){return y.toString(16).padStart(2,'0')}).join('');
            });
        };
        var f=function(d){try{return JSON.stringify(JSON.parse(d),null,2)}catch{return d}};
        var sh=function(j){
            if(typeof j!='string')j=JSON.stringify(j,null,2);
            return j.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"(\w+)":/g,'<span class="k">"$1"</span>:')
                .replace(/"([^"]+)"/g,'<span class="s">"$1"</span>')
                .replace(/\b(\d+)\b/g,'<span class="n">$1</span>');
        };
        var E=function(t){return document.getElementById(t)};
        var ws=null,hist=[],hi=-1;
        var us=function(s){E('sd').className='st '+s;E('st').textContent={on:'Connected',busy:'Connecting...',off:'Disconnected'}[s]};
        var doConnect=function(){
            var u=E('u').value.trim(),p=E('p').value.trim(),url=E('url').value;
            if(!u||!p){E('result').textContent='enter credentials';return;}
            us('busy');
            ws=new WebSocket(url);
            ws.onopen=function(){us('on');h(u+p).then(function(token){ws.send('Authorization: '+u+'.'+token)})};
            ws.onclose=function(){us('off')};
            ws.onerror=function(){us('off');E('result').textContent='connection failed'};
            ws.onmessage=function(e){E('result').innerHTML=sh(f(e.data))};
        };
        E('connect').onclick=doConnect;
        E('send').onclick=function(){
            if(!ws||ws.readyState===3){doConnect()}
            if(ws&&ws.readyState===1&&E('cmd').value.trim()){
                var cmd=E('cmd').value.trim();
                hist.unshift(cmd);
                if(hist.length>50)hist.pop();
                hi=-1;
                E('historyList').innerHTML=hist.map(function(c){return '<li onclick="setCmd(\''+c.replace(/'/g,"\\'")+'\')">'+c+'</li>'}).join('');
                ws.send(cmd);
            }
        };
        var setCmd=function(v){E('cmd').value=v};
        E('cmd').onkeydown=function(e){
            if(e.key=='Enter')E('send').click();
            if(e.key=='ArrowUp'&&hist.length){hi=Math.min(hi+1,hist.length-1);E('cmd').value=hist[hi]}
            if(e.key=='ArrowDown'){if(hi<=0){hi=0;E('cmd').value=''}else{hi-=1;E('cmd').value=hist[hi]||''}}
        };
        E('clr').onclick=function(){hist=[];hi=-1;E('historyList').innerHTML=''};
        E('cpy').onclick=function(){navigator.clipboard.writeText(E('result').textContent);E('cpy').textContent='Copied!';setTimeout(function(){E('cpy').textContent='Copy'},1e3)};
    </script>
</body>
</html>
