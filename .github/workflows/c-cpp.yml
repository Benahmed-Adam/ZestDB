name: C/C++ CI

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: cache downloaded dependencies
      uses: actions/cache@v4
      with:
        path: build/Release/_deps
        key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: deps-${{ runner.os }}-
    - name: build
      run: make
    - name: run tests
      run: make tests

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    # The CMake preinstalled on the runner does not pass the asio include directory to MSBuild 18 (Visual Studio 2026)
    - uses: lukka/get-cmake@latest
    - name: configure
      run: |
        cmake --version
        cmake -S . -B build -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"
    - name: build
      run: cmake --build build --config Release --parallel
    - name: run tests
      run: ctest --test-dir build -C Release --output-on-failure

  docker:

    needs: [ build, build-windows ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: benahmedadam/zestdb
        tags: |
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
