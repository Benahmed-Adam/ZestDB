name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasio-dev \
          libssl-dev \
          libzip-dev \
          libbz2-dev \
          liblzma-dev \
          libzstd-dev \
          zlib1g-dev \
          cmake
    - name: install libzippp
      run: |
        git clone https://github.com/ctabin/libzippp.git /tmp/libzippp
        cd /tmp/libzippp
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        sudo make install
        sudo ldconfig
    - name: build
      run: make
    - name: run tests
      run: make tests