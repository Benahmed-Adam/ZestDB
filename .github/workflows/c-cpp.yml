name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: cache downloaded dependencies
      uses: actions/cache@v4
      with:
        path: build/Release/_deps
        key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: deps-${{ runner.os }}-
    - name: build
      run: make
    - name: run tests
      run: make tests
