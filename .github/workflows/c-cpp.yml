name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: cache downloaded dependencies
      uses: actions/cache@v4
      with:
        path: build/Release/_deps
        key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: deps-${{ runner.os }}-
    - name: build
      run: make
    - name: run tests
      run: make tests

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: cmake -S . -B build -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL"
    - name: build
      run: cmake --build build --config Release --parallel
    - name: run tests
      run: ctest --test-dir build -C Release --output-on-failure
