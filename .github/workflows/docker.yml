name: Docker

# Publishes the image once CI passed on a push to main or dev (a merged pull request):
#   main -> benahmedadam/zestdb:latest and :sha-<commit>
#   dev  -> benahmedadam/zestdb:dev and :dev-sha-<commit>
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main, dev ]

jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - id: tags
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        short="${HEAD_SHA::7}"
        if [ "$BRANCH" = "main" ]; then
          echo "tags=benahmedadam/zestdb:latest,benahmedadam/zestdb:sha-$short" >> "$GITHUB_OUTPUT"
        else
          echo "tags=benahmedadam/zestdb:dev,benahmedadam/zestdb:dev-sha-$short" >> "$GITHUB_OUTPUT"
        fi
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
